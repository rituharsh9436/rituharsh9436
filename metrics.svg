<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="GitHub profile metrics">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .panel { fill: rgba(255,255,255,0.75); stroke: rgba(0,0,0,0.12); stroke-width: 1.5; }
      .soft { fill: #2d2d2d; }
      .blue { fill: #1f7ae0; }
      .muted { fill: #4b5563; }
      .label { font: 700 24px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
      .sub { font: 600 18px 'Segoe UI', Arial, sans-serif; fill: #374151; }
      .meta { font: 500 17px 'Segoe UI', Arial, sans-serif; fill: #111827; }
      .tiny { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #4b5563; }
      .icon { fill: #1f7ae0; }
      .grid { fill: #dfe7ed; }
      .grid-1 { fill: #d4efe1; }
      .grid-2 { fill: #9cd8bf; }
      .grid-3 { fill: #5dbd9a; }
      .grid-4 { fill: #2c9f78; }
      .language { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #1f2937; }
    </style>
    <clipPath id="clipProfile">
      <circle cx="55" cy="55" r="32"/>
    </clipPath>
  </defs>

  <rect class="bg" width="1200" height="540"/>
  <rect x="18" y="18" width="1164" height="504" rx="12" class="panel"/>

  <g transform="translate(44,40)">
    <g>
      <circle cx="55" cy="55" r="32" fill="#111827"/>
      <circle cx="55" cy="55" r="31" fill="#f0f4f8"/>
      <g clip-path="url(#clipProfile)">
        <rect x="23" y="23" width="64" height="64" fill="#f0f4f8"/>
        <circle cx="55" cy="47" r="18" fill="#7c3aed" opacity="0.9"/>
        <circle cx="47" cy="63" r="30" fill="#1f2937" opacity="0.9"/>
        <circle cx="63" cy="59" r="32" fill="#111827" opacity="0.9"/>
      </g>
    </g>

    <text class="label" x="105" y="48">Harsh Bhardwaj</text>

    <g class="meta" transform="translate(0,92)">
      <text x="0" y="0">◔</text>
      <text x="26" y="0">Joined GitHub 2 years ago</text>
      <text x="0" y="42">◌</text>
      <text x="26" y="42">Followed by 1 user</text>
    </g>

    <g class="meta" transform="translate(0,185)">
      <text x="0" y="0">↗</text>
      <text x="26" y="0">Activity</text>
      <text x="0" y="38">○</text>
      <text x="26" y="38">583 Commits</text>
      <text x="0" y="76">◫</text>
      <text x="26" y="76">0 Pull requests reviewed</text>
      <text x="0" y="114">↠</text>
      <text x="26" y="114">0 Pull requests opened</text>
      <text x="0" y="152">◍</text>
      <text x="26" y="152">0 Issues opened</text>
      <text x="0" y="190">◌</text>
      <text x="26" y="190">0 issue comments</text>
      <text x="0" y="228">▣</text>
      <text x="26" y="228">15 Repositories</text>
      <text x="0" y="266">◈</text>
      <text x="26" y="266">Prefers MIT license</text>
      <text x="0" y="304">○</text>
      <text x="26" y="304">0 Releases</text>
      <text x="0" y="342">◍</text>
      <text x="26" y="342">0 Packages</text>
      <text x="0" y="380">◩</text>
      <text x="26" y="380">141 MB used</text>
      <text x="0" y="418">⌘</text>
      <text x="26" y="418">9 Languages</text>
    </g>
  </g>

  <g transform="translate(612,40)">
    <g class="meta">
      <text x="0" y="0">▦</text>
      <text x="26" y="0">Contributed to 13 repositories</text>
      <text x="0" y="62">◌</text>
      <text x="26" y="62">Community stats</text>
      <text x="0" y="104">◫</text>
      <text x="26" y="104">Member of 0 organizations</text>
      <text x="0" y="146">◌</text>
      <text x="26" y="146">Following 2 user</text>
      <text x="0" y="188">♡</text>
      <text x="26" y="188">Sponsoring 0 repositories</text>
      <text x="0" y="230">★</text>
      <text x="26" y="230">Starred 5 repositories</text>
      <text x="0" y="272">◉</text>
      <text x="26" y="272">Watching 1 repository</text>
      <text x="0" y="314">♡</text>
      <text x="26" y="314">0 Sponsors</text>
      <text x="0" y="356">✦</text>
      <text x="26" y="356">2 Stargazers</text>
      <text x="0" y="398">✧</text>
      <text x="26" y="398">0 Forkers</text>
      <text x="0" y="440">◌</text>
      <text x="26" y="440">0 Watchers</text>
    </g>
  </g>

  <g transform="translate(210,425)">
    <text class="sub" x="220" y="25">Most used languages</text>
    <rect x="0" y="40" width="780" height="58" rx="10" fill="#dfe7ed"/>

    <g transform="translate(18,52)">
      <circle r="7" fill="#f5d547"/>
      <text class="language" x="18" y="5">JavaScript</text>

      <circle cx="155" cy="0" r="7" fill="#3f7bd1"/>
      <text class="language" x="172" y="5">C++</text>

      <circle cx="270" cy="0" r="7" fill="#4d9de8"/>
      <text class="language" x="287" y="5">TypeScript</text>

      <circle cx="450" cy="0" r="7" fill="#f39c12"/>
      <text class="language" x="467" y="5">Jupyter Notebook</text>

      <circle cx="650" cy="0" r="7" fill="#a463f5"/>
      <text class="language" x="667" y="5">HTML</text>

      <circle cx="770" cy="0" r="7" fill="#5f86d9"/>
      <text class="language" x="787" y="5">CSS</text>
    </g>

    <g transform="translate(18,90)">
      <circle r="7" fill="#4ba3ff"/>
      <text class="language" x="18" y="5">PLpgSQL</text>

      <circle cx="175" cy="0" r="7" fill="#3d8bfd"/>
      <text class="language" x="192" y="5">Python</text>
    </g>
  </g>
</svg>

