<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#112230" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="40" fill="url(#bg)" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
  <rect width="200" height="200" rx="40" fill="url(#glow)" />
  
  <g transform="translate(10, 10)">
    <!-- Git Graph Lines -->
    <path d="M 60 130 L 60 50" stroke="#06b6d4" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M 60 90 C 90 90, 90 60, 120 60" stroke="#06b6d4" stroke-width="8" fill="none" stroke-linecap="round" />
    
    <!-- Joint Dot -->
    <circle cx="60" cy="90" r="6" fill="#06b6d4" />

    <!-- Nodes -->
    <circle cx="60" cy="130" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="8" />
    <circle cx="60" cy="50" r="14" fill="#0f172a" stroke="#06b6d4" stroke-width="8" />
    <circle cx="120" cy="60" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="8" />
  </g>
</svg>
